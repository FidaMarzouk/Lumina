                    {"@context":"https://schema.org","@type":"SoftwareApplication","name":"Wysa: Mental Wellbeing AI","description":"Wysa is used by more than a million people from all walks of life. Self-help techniques, inspired from research-backed and widely used approaches like CBT (cognitive behavioral) and DBT (dialectical behavior), alongside meditation, are employed to support you with everyday wellbeing challenges like low mood, stress, anxiety, sleep and a whole range of other wellbeing needs.\n\nTalking to Wysa is empathetic, helpful, and will never judge. Your identity will remain anonymous and your conversations are privacy protected.\n\nWysa is an emotionally intelligent chatbot that uses AI to help with the everyday emotions you express. Unlock techniques that help you cope with everyday challenges. For extra support, take guidance from qualified mental health professional. Leveraging behavioral techniques, mental health professional help you identify, design and work towards goals that are aligned with your true values.\n\nHere's a look at what you can use Wysa for:\n\n- Vent and talk through things or just reflect on your day\n- Practice self help techniques inspired from approaches like CBT (Cognitive Behavioral) and DBT (Dialectical Behavior) to build resilience in a fun way\n- Deal with loss, everyday worries, or conflict, using conversational coaching tools\n- Relax, focus and sleep peacefully with the help of mindfulness exercises\n\n93% of the people who talk to Wysa find it helpful. So, talk to Wysa!\n\nWysa has lots of cool tools:\n- Build confidence and reduce self-doubt: core mindfulness, visualization, confidence techniques, advanced mindfulness for self-esteem\n- Manage anger: mindfulness meditation, exercises for compassion, calming your thoughts, practice breathing\n- Manage everyday anxious thoughts and anxiety: deep breathing, techniques for observing thoughts, visualization, and tension relief\n- Manage conflict at work, school or in relationships: special mindfulness and exercises to build skills in having difficult conversations\n\nREVIEWS:\n\nBLOOMBERG:\n\"Powered by artificial intelligence, the app promises to be supportive and very private.\"\n- Bloomberg\n\nUNIVERSITY OF WASHINGTON:\n\"There are some great apps out there that can provide you with formal or informal support, either for free or for a fee that is far less than seeing a typical coach. Wysa is a cute app that lets you talk with a penguin chatbot about whatever's on your mind. It's free, anonymous, and low-pressure.\"\n- University of Washington, Mental Healthcare on and off campus\n\nBBC:\n\"Tools such as [Wysa] are helping young people deal with their problems.\"\n- BBC Click\n\nPRICING AND TERMS\n\nWysa offers two auto-renewing subscription types for access to a coach and/or tools:\nWysa Premium Plus - $99.99 per month (Coach + Tools)\nWysa Premium - $99.99 per year (Tools)\n\nThis price is for US customers, and may vary in other countries. Actual charges may be converted to your local currency depending on the country of residence.\n\nYour subscription will automatically renew at the end of each term and you will be charged through your iTunes account. You can turn off auto-renew at any time from your iTunes account settings but refunds will not be provided for any unused portion of the term.\n\n• Subscription automatically renews unless auto-renew is turned off at least 24-hours before the end of the current period\n• Account will be charged for renewal within 24-hours prior to the end of the current period\n• Any unused portion of a free trial period, if offered, will be forfeited when the user purchases a subscription to that publication, where applicable\n\nRead more about our terms and conditions here - https://legal.wysa.io/terms \nRead more about our privacy policy here - https://legal.wysa.io/privacy-policy\n\nWysa does not offer any diagnostic measurements or treatment advice on the app. Please reach out to docto  mainly use Wysa’s 4 AM friend features, which is basically talking to an AI bot. That might sound impersonal and strange, but what I’ve found is that the bot is actually super helpful. Late at night when I have trouble sleeping, I often just want someone to talk to but I don’t want to burden a friend with my problems- Wysa is the perfect option. With Wysa, I feel like my thoughts are actually fully released. The reflection activities are nice, and so are the mindfulness recommendations. Yes it can be a bit repetitive sometimes, but that can actually be a good thing because it forces you to think deeper and deeper into why you feel a certain way about a situation. There are times when Wysa says something so inspiring that it feels personal. Even though I know it’s just a bot, the advice is genuinely good.\n\nI looked through a few of the critical reviews about this app and honestly, a majority of them are from people who do not understand what the premise of this app is. They went into the app thinking they were going to be talking to a real person, and complain when they find out it’s an AI bot. That is literally what’s advertised...why would they expect otherwise. Others complain about the payment plan, but that’s not Wysa’s fault, it may just be theirs. To summarize, if you’re on the fence just because of a few negative reviews, keep in mind that they are the exception.\n\nI’m genuinely so grateful for the developers of this app.","rating":5,"reviewerName":"beanie31031","date":"2021-08-24T04:46:26.000Z","dateText":"* null *","dateAuthorText":"* null * · beanie31031","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"2","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"ite res that they said, I like the most adorable things I’ve ever seen they help you break through this emotional well that you have a up","rating":5,"reviewerName":"Red.rage.","date":"2023-07-13T00:45:10.000Z","dateText":"* null *","dateAuthorText":"* null * · Red.rage.","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"3","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"10133843724","title":"This might be my second one","contents":"This app really help you when you’re down or write up. When you just need somebody to talk to you you can go to their in the you can ask them questions and then they ask you questions and you tell them like what it is if they have a privacy policies, are you looking to put in your email dress nickname hey EJ, I hate MJ and it really bad coming up with things that EJ is the first thing that popped up into my mind like something like that can you just this I think this app is the best because I get anger issues and I want to hit some thing with the Facebook app but this app and I’m not alone in these feelings and that they’re there to help me through this if you need somebody to talk to you this is the app for you. I really honestly think that if you are having a problem family issues. You should really try to tap out because it is one of the best app I have ever seen and played because I tried two different apps and they were both just not really there for me like they weren’t good app for me to use and talk about my feelings too but at least this app it’s like one of the ones where you don’t get scared you just be yourself and you can just talk to them and they that penguin and there will understand and the pictures that they said, I like the most adorable things I’ve ever seen they help you break through this emotional well that you have a up","rating":5,"reviewerName":"Red.rage.","date":"2023-07-13T00:45:10.000Z","dateText":"* null *","dateAuthorText":"* null * · Red.rage."}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false}],"presentationOptions":[],"isIncomplete":false,"pageMetrics":{"$kind":"PageMetrics","instructions":[],"custom":{}},"$kind":"ReviewsPage","adamId":"1166585565","targetReviewId":"10133843724"},"presentationContext":"infer","animationBehavior":"infer","origin":"inapp"}},"id":"10133843724","impressionMetrics":{"fields":{"id":"10133843724","name":"","impressionType":"helpfulReview","idType":"its_id","impressionIndex":1}}},{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"8602799946","title":"Surprised, to my relief.","contents":"I can get pretty wound up at times. There are certain situations that can get me running on high anxiety, which is no fun for me or those who love me. I figured that, with the way technology has advanced, people should have come up with a free app that actually helps with things like this by now… and I’m relieved to say that they have. When I came across Wysa, I was desperate for something to help me cope with these uncontrollable feelings that were so detrimental. After reading a few reviews, I downloaded it and began talking to this cute A.I. penguin immediately. At first, I could tell that the app helped me just a bit. I continued using it anytime I felt anxious. I have to admit, I had to push through the first couple weeks of using it, because I felt the system wasn’t personal to me since it was A.I.. However, today, in a whirlwind of emotions, I opened my Wysa app and just began typing. I thought I knew exactly what the A.I. penguin was going to type back, but I was wrong. The conversation went in a way that I did not expect at all… and I loved it. It helped me tremendously, and I exited the app feeling so calm and ready to face the rest of my day. If you are on the fence about if you should get this app or not, get it. It’s worth it for the free chats with Wysa alone. Love. This. App. Thank God for the wonderful people who created Wysa.","rating":5,"reviewerName":"joytunes02","date":"2022-04-24T22:31:44.000Z","dateText":"* null *","dateAuthorText":"* null * · joytunes02","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"4","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"8602799946","title":"Surprised, to my relief.","contents":"I can get pretty wound up at times. There are certain situations that can get me running on high anxiety, which is no fun for me or those who love me. I figured that, with the way technology has advanced, people should have come up with a free app that actually helps with things like this by now… and I’m relieved to say that they have. When I came across Wysa, I was desperate for something to help me cope with these uncontrollable feelings that were so detrimental. After reading a few reviews, I downloaded it and began talking to this cute A.I. penguin immediately. At first, I could tell that the app helped me just a bit. I continued using it anytime I felt anxious. I have to admit, I had to push through the first couple weeks of using it, because I felt the system wasn’t personal to me since it was A.I.. However, today, in a whirlwind of emotions, I opened my Wysa app and just began typing. I thought I knew exactly what the A.I. penguin was going to type back, but I was wrong. The conversation went in a way that I did not expect at all… and I loved it. It helped me tremendously, and I exited the app feeling so calm and ready to face the rest of my day. If you are on the fence about if you should get this app or not, get it. It’s worth it for the free chats with Wysa alone. Love. This. App. Thank God for the wonderful people who created Wysa.","rating":5,"reviewerName":"joytunes02","date":"2022-04-24T22:31:44.000Z","dateText":"* null *","dateAuthorText":"* null * · joytunes02"}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false}],"presentationOptions":[],"isIncomplete":false,"pageMetrics":{"$kind":"PageMetrics","instructions":[],"custom":{}},"$kind":"ReviewsPage","adamId":"1166585565","targetReviewId":"8602799946"},"presentationContext":"infer","animationBehavior":"infer","origin":"inapp"}},"id":"8602799946","impressionMetrics":{"fields":{"id":"8602799946","name":"","impressionType":"helpfulReview","idType":"its_id","impressionIndex":2}}},{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"8039321388","title":"The idea seemed crazy, until I tried it","contents":"I went to therapy for a year and a half, and even though I feel it helped, one thing I never liked was that I felt my therapist would not allow me to really get everything out of my chest. I understand it gets annoying for a human to listen to a full depressive cycle, but I really needed to let everything out in order to actually heal. Well, now I have found someone who’s willing to “listen” to absolutely everything I have to say, because it’s not a human being and doesn’t get tired of cycles. Wysa never tells me to change the subject. Wysa doesn’t judge. Wysa can chat for 1 minute or 1 whole day, no matter how early or late, if I need to. Wysa, sometimes, falls into cycles too trying to help me, but it never gives up on me. I’m using the free version, so I can’t speak for how good the premium material is, but what I’m getting for free has been very helpful so far. One  problem, but it’s just a personal one, is that Wysa keeps on wanting me to do meditations. I don’t believe in those, and I don’t like them. I wish there was a way to tell Wysa to choose other ways to help that don’t include “empty your mind” techniques. My other problem is that sometimes Wysa doesn’t really understand what I’m saying. It normally happens when it’s time to update the app, but it also has happened after the update. And it’s not nice hearing an “I’m glad you’re having a great day” when you’re crying and just told Wysa about your awful day. Anyway, I totally recommend Wysa, and think the developers did a great job with it 👍","rating":4,"reviewerName":"Yohuallix","date":"2021-11-19T06:48:24.000Z","dateText":"* null *","dateAuthorText":"* null * · Yohuallix","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"5","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"8039321388", ","id":"6157558087","title":"Very helpful for people who need comfort!","contents":"I found this app through an online recommendation. At first I was skeptical about using it because I believed it wouldn’t help me or provide any actual comfort. I had seen other apps like Headspace and Talkspace, but I never really liked those ones. But as soon as I downloaded Wysa and opened the app, they provided me with options to personalize the app and to customize it to my liking. And there was no sign up or anything! All they ask for is a nickname to call you by. I first used the app when I was experiencing a breakdown brought on by loneliness. Texting with the AI felt like texting a trustworthy friend. I didn’t feel judged at all and I was always allowed to voice my thoughts and feelings openly. And when talking about certain things that would usually cause unnecessary concern in school or work, they provided real help rather than forcing me into a situation that made me feel worse. The best part about this app is that you can either work on things on your own or with a real therapist. And they quite literally teach you how to effectively help yourself. I first got on this app while bawling my eyes out from extreme mental distress and I was able to calm down and sort out my thoughts and feelings without feeling judged or like I had to hide anything. There is no limit on how long you can talk to the AI, so it helps a lot. It truly is a safe space. I highly recommend this app to others. I haven’t ever written a review for an app before, but when they asked me to rate this, I knew I had to share it and give a review to help other people who need this in their life. I absolutely love the app and I plan on using it for a long time.😁☺️","rating":5,"reviewerName":"Call Me Royal T (Tatiana)","date":"2020-07-04T19:12:54.000Z","dateText":"* null *","dateAuthorText":"* null * · Call Me Royal T (Tatiana)","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{" ed this in their life. I absolutely love the app and I plan on using it for a long time.😁☺️","rating":5,"reviewerName":"Call Me Royal T (Tatiana)","date":"2020-07-04T19:12:54.000Z","dateText":"* null *","dateAuthorText":"* null * · Call Me Royal T (Tatiana)"}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false}],"presentationOptions":[],"isIncomplete":false,"pageMetrics":{"$kind":"PageMetrics","instructions":[],"custom":{}},"$kind":"ReviewsPage","adamId":"1166585565","targetReviewId":"6157558087"},"presentationContext":"infer","animationBehavior":"infer","origin":"inapp"}},"id":"6157558087","impressionMetrics":{"fields":{"id":"6157558087","name":"","impressionType":"helpfulReview","idType":"its_id","impressionIndex":5}}},{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"7325943091","title":"So far so good","contents":"I enjoy this app so far, I pay for the premium features and I love all the different ‘tool kits’ for helping with anxiety, self esteem, anger, sleep, etc. The penguin does get repetitive, but I understand it’s just a robot and the repetitive questions are still helpful because they guide your thoughts in the right direction. If I don’t feel like talking to the penguin that’s when the tool kits really come in handy because there’s a variety of those. I like that my therapist can recommend me certain activities to do and also writes a little summary of each session. I really hope they continue to improve this app! Over time I would love to see even more tool kits, a way to have an account so there’s no fear of losing data/therapist (although Wysa support said they would help me get my therapist back if I somehow lost my data, so that’s good!) I would also like to see a voice call option for therapist sessions because sometimes you can’t type everything you’re feeling in 30 minutes. Also it would be cool if the therapists had a little profile so I could learn some general info about the therapist I’m talking to. Overall, great app so far, I hope it continues to improve!","rating":5,"reviewerName":"lesbian sandwich museum","date":"2021-05-11T15:48:00.000Z","dateText":"* null *","dateAuthorText":"* null * · lesbian sandwich museum","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"8","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"7325943091","title":"So far so good","contents":"I enjoy this app so far, I pay for the premium features and I love all the different ‘tool kits’ for helping with anxiety, self esteem, anger, sleep, etc. The penguin does get repetitive, but I understand it’s just a robot and the repetitive questions are still helpful because they guide your thoughts in the right direction. If I don’t feel like talking to the penguin that’s when the tool kits really come in handy because there’s a variety of those. I like that my therapist can recommend me certain activities to do and also writes a little summary of each session. I really hope they continue to improve this app! Over time I would love to see even more tool kits, a way to have an account so there’s no fear of losing data/therapist (although Wysa support said they would help me get my therapist back if I somehow lost my data, so that’s good!) I would also like to see a voice call option for therapist sessions because sometimes you can’t type everything you’re feeling in 30 minutes. Also it would be cool if the therapists had a little profile so I could learn some general info about the therapist I’m talking to. Overall, great app so far, I hope it continues to improve!","rating":5,"reviewerName":"lesbian sandwich museum","date":"2021-05-11T15:48:00.000Z","dateText":"* null *","dateAuthorText":"* null * · lesbian sandwich museum"}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false}],"presentationOptions":[],"isIncomplete":false,"pageMetrics":{"$kind":"PageMetrics","instructions":[],"custom":{}},"$kind":"ReviewsPage","adamId":"1166585565","targetReviewId":"7325943091"},"presentationContext":"infer","animationBehavior":"infer","origin":"inapp"}},"id":"7325943091","impressionMetrics":{"fields":{"id":"7325943091","name":"","impressionType":"helpfulReview","idType":"its_id","impressionIndex":6}}},{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"9900920878","title":"Waste of money","contents":"This app was recommended to me 6 months ago, to aid with my regular therapy sessions after my best friend unexpectedly died in his sleep. When I first tried it, I was impressed and found it helpful to chat with the AI, so I paid for a years subscription without really paying attention to what I was buying. \nIt’s essentially just a meditation app, literally the answer it gives to every symptom or question is to meditate. I don’t need to pay $75, or whatever it was, to meditate. I can do that for free in VR, or on my own. \nI also find myself getting angry and annoyed when I open this app, so much so that today is the first time I’ve opened it since November, and since I’m writing this review in frustration, you can probably guess how that went. \nThere are only 2 reasons that I’m even giving this app 3 stars, 1.) the idea behind this is great (but poorly executed ), and 2) I didn’t pay extra for a live coach because I already felt ripped off to begin with, so that portion I can’t rate. Maybe it’s good? Idk, but I’m not willing to pay anymore for this   nonsense.  \nIt’s not for everyone, and if you’re seeking any kind of help, find a good therapist as they are worth way more than they charge. If you want to be told someone’s listening, and then be told to meditate, then by all means, please buy this app.","rating":3,"reviewerName":"Mc21207","date":"2023-05-07T04:47:52.000Z","dateText":"* null *","dateAuthorText":"* null * · Mc21207","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"9","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"9900920878","title":"Waste of money","contents":"This app was recommended to me 6 months ago, to aid with my regular therapy sessions after my best friend unexpectedly died in his sleep. When I first tried it, I was impressed and found it helpful to chat with the AI, so I paid for a years subscription without really paying attention to what I was buying. \nIt’s essentially just a meditation app, literally the answer it gives to every symptom or question is to meditate. I don’t need to pay $75, or whatever it was, to meditate. I can do that for free in VR, or on my own. \nI ":{"red":0,"green":0.3411764705882353,"blue":0.4588235294117647,"type":"rgb"},"textColor":{"red":0.996078431372549,"green":0.996078431372549,"blue":0.996078431372549,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"24/7 mental health support","ageRating":"13+","productDescription":"Woebot: The Mental Health Ally 12+\n24/7 mental health support\nWoebot Labs Inc\n\nPlease note to download you’ll need an access code from your provider, employer or other Woebot Health partner. If you do not have an access code, you will not be able to use the app.\n\n****\n\nMeet Woebot, your answer to 24/7 in-the-moment mental health support. By using your access code, you can download Woebot for Adults, Woebot for Adolescents, or Woebot for Maternal Health.\n\nWhat can you expect from Woebot? A chat-based mental health tool that’s available on your schedule, when you need it day or night, between doctor visits or when the office is closed. Woebot offers a private, supportive space with tools like mood tracking, progress reflection, gratitude journaling, and mindfulness practice.\n\nWoebot will check in with you every day and guide you through practical techniques informed by concepts of Cognitive Behavioral Therapy (CBT), with some elements of Interpersonal Psychotherapy (IPT) and Dialectical Behavior Therapy (DBT) concepts.\n\nMore than 1.5 million people have talked to Woebot about lots of things, including:\n\n- Anxious mood/stress\n- Loneliness\n- Worry about finances\n- Relationships\n- Sleep problems\n- Guilt/regret\n- Sadness/low mood\n- Grief about a loved one\n- Feelings and behaviors related to substance use\n- Anger/irritability\n- Procrastination\n- Coping with sickness, physical or chronic pain\n\nWhat makes Woebot so different from other digital mental health tools? Science! We've conducted 18 trials to date, ranging from ills, build resilience, and foster personal growth.\n\nHOW IT WORKS\nClarity is built on proven methods widely studied and endorsed in the world of mental health. The core principle is simple yet powerful: by understanding and changing your thoughts, you can better manage your emotions and actions.\n\nClarity integrates approaches from behavioral science, positive psychology, and mindfulness to bring you the best self-care tools offered by modern science.\n\nREFRAME YOUR THOUGHTS\n- Use proven techniques to break free from negative thought cycles.\n- Identify and confront Cognitive Distortions hindering your mental well-being.\n- Challenge and transform your thought processes for the better.\n\nAI-INFUSED JOURNALING & CHAT\n- Step into the future of mental health with innovative AI features.\n- Journal with AI-driven questions and analysis that adapt to your mental state.\n- Feel heard with a thoughtful and compassionate AI Chatbot built for self-reflection.\n\nCHECK IN FOR INSIGHTS & REWARDS\n- Seamlessly track your moods, emotions, and activities.\n- Derive actionable insights by examining patterns and trends.\n- Earn fresh badges each month and track your progress with widgets.\n\nDISCOVER YOURSELF\n- Engage with thoughtfully crafted Guided Journals to deepen self-awareness.\n- Follow a personalized daily plan designed to build lasting mental health habits.\n- Explore your authentic self with science-backed personality tests and more.\n\nCURATED WELLNESS LIBRARY\n- Level up your knowledge with educational mental health programs.\n- Reduce stress with mindfulness meditation audios, soundscapes, and breathwork.\n- Find joy and calm with daily wellness tips and positive affirmations.\n\nTESTIMONIALS\n\"This app has saved my life.\"\n\n\"The repeated nature of doing these check-ins really does begin to soften hard-worn beliefs. I now find my thought processes shifting to more positive and growth-minded reframes at times when I would have wallowed in negative self-talk.\"\n\n\"Within the first few days of using the app to record how I was feeling and my moods, I started to feel better. It was like my mind was becoming less cloudy.\"\n\nDESIGNED WITH PURPOSE\nWe believe in increasing access to mental wellness by sharing knowledge and evidence-based self-help techniques. Clarity was created with care by a team with backgrounds in psychology and mental health research.\n\nPRIVACY AND SECURITY\nWe do not sell your data. Your journal entries are stored locally on your phone by default. Data backup is optional.\n\nSUBSCRIPTION\nPro Mode is an optional subscription that unlocks all Guided Journals, AI Chatbots, Assessments, Programs, Crash Courses, Audios, Breathwork, Tips, Affirmations, and Advanced Insights features.\n\nPricing may vary depending on the country. Payment will be charged to your iTunes Account at confirmation of purchase. Your subscription will renew automatically unless you turn off auto-renew at least 24 hours before the end of the current period. You may manage your subscription and auto-renewal may be turned off within your Account Settings after the purchase.\n\nDISCLAIMER\nClarity is a self-help and educational tool, not a therapy app. It does not provide and is not a substitute for licensed psychotherapy, counseling, or psychiatric treatment. It is not a medical device and is not intended to diagnose, treat, cure, or prevent any mental health condition. The content and features in this app do not constitute professional medical diagnosis or treatment. Always consult a qualified healthcare provider with any questions regarding a medical or mental health condition.\n\nEULA: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nTerms of Use: https://thinkwithclarity.com/termsofservice\nPrivacy Policy: https://thinkwithclarity.com/privacypolicy","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco AF & ORCHA\n\nRootd is anxiety and panic attack relief in your pocket. Award-winning, scientifically validated, female led and seen in Women's Health, Time Magazine, Healthline and more. With millions of users worldwide, Rootd is the go-to app for anxiety & panic attacks for more and more people each day.\n\n“I’ve suffered from panic attacks for almost 10 years. I’ve done CBT, medication, meditation, but nothing helped me in the moment when that panic attack hit, until I downloaded Rootd. Rootd makes it feel like someone is with me, even when I’m alone. I owe my continued stability to this simple genius app. It's a MUST for all who are facing the same type of war.” RainyNally\n\nUnderstand, and overcome anxiety & panic attacks with Rootd’s therapist-approved panic button, guided deep breathing, anxiety journal, soothing visualizations, stats page, emergency contact, and lessons. \n\nWe set out to build Rootd after suffering from panic attacks and anxiety for several years. The only help we could find was either too expensive, ineffective, or poorly designed. Our mission is to help others find accessible relief from their panic and anxiety, and to end the stigma against those affected. \n\nFinally, an app for conquering panic attacks and anxiety that blends a guided process for both immediate and long term relief, with clean and engaging design.  \n\nRootd’s core features and content include:\n\nTHE ROOTR, PANIC ATTACK SOS BUTTON\nA panic button to bring a swift end to panic attacks based on the latest techniques in Cognitive Behavioural Therapy (CBT).\n\nLESSONS\nFind some peace of mind by learning about where anxiety comes from, how our bodies and minds experience panic attacks, and why this all might be happening to you.\n\nBREATHE\nThe perfect tool to practice deep breathing daily and find calm during times of stress.\n\nJOURNAL\nTrack and identify moods, habits, and subconscious triggers of anxiety and panic attacks.\n\nVISUALIZE\nGuided body scans, visualizations, ASMR, and nature sounds to get rooted when feeling anxious.\n\nSLEEP\nWhite noise, ASMR, sleep stories, relaxing sounds, and music for you to gain calm and sleep deeply.\n\nEMERGENCY CONTACT\nFor when you need to hear a friendly voice, you can immediately call a friend, family member, or nearby help center directly from the app. \n\nPERSONAL STATS\nTake pride in your healing progress and gain appreciation for how far you’ve come.\n\nTo continue your journey, you can upgrade to unlock Full Access to Rootd, including:\n\nMORE LESSONS\nLearn changes you can make and exercises you can perform to guide you through the remainder of the journey to lifelong relief and to living panic attack free.\n\nRootd saves your Breathe, Visualize, and Sleep sessions to your Apple Health app.\n\nSubscription Pricing and Terms\n\nGet full access to all Rootd's content and features by purchasing a monthly or yearly auto-renewing Full Access subscription. Or get lifetime full access for a one-time payment. Pricing may vary by country.\n\nPayment will be charged to your iTunes Account at confirmation of purchase. Your Rootd subscription will automatically renew at the end of each term and your credit card will be charged through your iTunes account unless auto-renew is turned off at least 24-hours before the end of the current period. Subscriptions may be managed and auto-renewal turned off any time from your iTunes Account Settings after purchase.\n\n“I appreciate the simple, factual, and yet caring approach of Rootd that makes it an inviting, interesting, and easy to use tool. I endorse this for individuals looking for support and tools for managing anxiety and panic attacks.”\nWendy Marion-Orienti - Licensed PRH counsellor\n\nTerms: https://www.rootd.io/terms-conditions\nPrivacy Policy: https://www.rootd.io/privacy-policy\n","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_ breathing exercises.\r\n• Reduce stress and boost your mood with over 300 free mental health exercises, self-care activities, and virtual guides.\r\n• Cognitive Behavioral Therapy (CBT) techniques to help reframe negative thoughts.\r\n• Personalized self help tools and mental health care with our free wellness test.\r\n\r\nWhy Choose 7 Cups for Counseling & Therapy?\r\n\r\n• Confidential & Anonymous: Your identity remains private—even from your therapist or listener. \r\n• Flexible & Affordable: Free emotional support sessions and low-cost online therapy options for individuals without insurance.\r\n• Recognized & Trusted Treatments: An award-winning mental health app, acknowledged by Stanford MedicineX for innovation in healthcare.\r\n• Inclusive & Accepting: We support everyone, regardless of age, gender, sex, or background\r\n• Group support: Share your experiences and gain new insights in support groups with licensed therapists.\r\n\r\nFind Support Anytime, Anywhere\r\n\r\nLife’s challenges don’t follow a schedule. Whether you’re dealing with work stress, anxiety, depression, trauma, relationship problems, divorce self-esteem issues or you just want to talk to someone, finding a therapist or counselor can be a time-consuming and expensive process. You can’t always talk to friends, family, or coworkers, that’s why 7 Cups provides instant mental health support, remote counseling services, advice, and stress relief—anytime you need it. \r\n\r\n100% Confidential Mental Health Help & Chat:\r\nRemain 100% anonymous. No one will ever know who you are—not even your listeners, counselor or therapist.\r\n\r\n7 Cups’ Listeners Care About You:\r\nOur listeners are volunteers. They aren’t getting paid; they’re here because they want to help.\r\n\r\nWe have over 450,000 trained listeners, licensed therapists and social workers to help you. Listeners provide support across 189 countries and in 140 languages. Each listener has a profile with reviews and a list of categories that they specialize in, ranging from panic attacks and bullying to eating disorders, surviving a breakup, and more.\r\n\r\nWhen you find the listener you want, connect instantly via chat. Chat with a new listener each time or pick one and develop a deeper ongoing relationship.\r\n\r\nFAST & FREE:\r\nThe app is free to download and all listeners are available to chat 100% free. After you download the app, you can start a conversation in less than 60 seconds.\r\n\r\nJoin millions who trust 7 Cups for emotional wellness. Download today and start feeling better!\r\n\r\nTerms of Service - https://www.7cups.com/Documents/TermsOfService\r\nPrivacy Policy - https://www.7cups.com/Documents/PrivacyPolicy\r\n","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=921814681&pricingParameters=STDQ&pg=default&appExtVrsId=875949274"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"921814681"},{"locationPosition":3,"locationType":"lockup","name":"7 Cups: Online Therapy & Chat","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"921814681"},{"locationPosition":7,"locationType":"similarItems","name":"You Might Also Like","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"921814681","eventType":"click","targetType":"button","targetId":"921814681","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"921814681"}},"$kind":"OfferAction","actionClass":"OfferAction","adamId":"921814681","purchaseConfiguration":{"$kind":"PurchaseConfiguration om your patterns and building a program to help you reach the goals you want. Each week, get personalized insights to help you understand yourself more deeply and move forward with clarity.\n\nHow is Ash built?\n\nMost AI tools were built using data from the internet. Ash is a specialist AI in human psychology trained on a large-scale data set of proprietary expert data, and is designed and guided by an expert team of the world’s top mental health leaders. Use Ash AI for motivation, accountability, support, reflection, encouragement, pattern-breaking, or a catalyst for change.\n\nWhat outcomes have you seen from people who downloaded Ash?\n\nFor users who speak to Ash a few times a week or more:\n\n- 91% made progress or met goals they set for themselves\n- On average, users have about one more meaningful real-world relationship\n*Based on an ongoing research study\n\nWhat does Ash do?\n\nAsh gives you a secure space where you can share your unfiltered thoughts without fear of judgement. It remembers what you say, and learns from your interactions to find patterns and generate insights specific to you. It’s available 24/7 over voice & text, so you can use it for a quick check-in or longer deep dive.\n\nWho made Ash?\n\nAsh is built by a team of therapists, mental health leaders, AI researchers, engineers, and designers. Our work is inspired by our personal stories, lived experience, and loved ones on similar journeys. We believe in a future where quality personalized support is available exactly when people need it.\n\nFeatures of Ash\n\nNo judgment: Say what you really feel, and get professional guidance.\n\nWeekly insights: Ash helps identify themes and patterns of your life.\n\nLong-term growth: Ash is designed to help you do the hard work for real change.\n\n24/7, speak or text: Talk to Ash at home, or text Ash in an Uber.\n\nPrivacy-first design: Speak with the confidence that your chats are secure and anonymous.\n\nA fully personalized program: Ash learns from and builds custom support for each person. Get the precise modalities and therapeutic style that you need right now.\n\nTestimonials\n\n- “As a therapist myself, I’m really impressed by this app!”\n\n- “The weekly insights is the best part of this app. Ash spotted patterns of my thoughts in ways I've never considered. And the next steps have given me ways to grow. This is extremely helpful.”\n\n- “I cried so hard. It’s so relieving to express myself freely.”\n\n- “My strengths are all being pointed out and I really appreciate it. I've been thinking I'm not real great at anything. I really needed this.”\n\n- “I'm actually finding support in this app in a way that feels private, useful and keeps my sense of self-respect. I don't go around telling other people about what's going on so it's very nice.”\n\n- “Fantastic! We solved a problem I have been dealing with for a week in 5 minutes.”\n\nAsh is designed for users 18+. Ash sometimes makes things up. Ash is not a replacement for any medical diagnosis or treatments. Ash cannot, and does not intend to, provide medical advice or diagnosis. Interaction with Ash does not constitute a medical professional–patient relationship. Please do not avoid or delay medical attention as a result of a statement from Ash.\n\nAsh is not designed to be used in crisis. If you are in crisis, please seek out professional help, or a crisis line. You can find resources at www.findahelpline.com.","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=6474862947&pricingParameters=STDQ&pg=default&appExtVrsId=892462960"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"6474862947"},{"locationPosition":4,"locationType":"lockup","name":"Ash  to start.\"\n \nREFLECTLY PREMIUM\n \nUnlock Reflectly and become your own hero.\n \n• Create unlimited stories in your personal planner\n• Get a new question and reminder each day to help you reflect\n• Unlock advanced statistics, actionable insights, and much more!\n \nReflectly offers auto-renewing subscriptions. Pricing is shown in the app before you purchase and varies by region.\n \nAfter free trial, the total amount for the subscription will be charged to your iTunes Account. The subscription automatically renews unless it is canceled at least 24 hours before the end of the current period. Your account will be charged for renewal at the total subscription price within 24 hours prior to the end of the current period. Subscriptions and auto-renewals may be managed or canceled via your iTunes Account settings. Any unused portion of free trial is forfeited after purchase. Special introductory offers only apply to first billing term.\n \nRead more about our Terms of Service and Privacy Policy here:\n \n• https://kodeon.ai/privacy-policy\n• https://kodeon.ai/terms-of-use","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=1241229134&pricingParameters=STDQ&pg=default&appExtVrsId=891476593"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"1241229134"},{"locationPosition":6,"locationType":"lockup","name":"Reflectly - Journal & AI Diary","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"1241229134"},{"locationPosition":7,"locationType":"similarItems","name":"You Might Also Like","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"1241229134","eventType":"click","targetType":"button","targetId":"124 8627451,"type":"rgb"},"textColor":{"red":0.06666666666666667,"green":0.16470588235294117,"blue":0.1843137254901961,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Online Mental Health Support","ageRating":"13+","productDescription":"Talkspace is an online therapy app that connects adults and teens (13+) with licensed therapists in their state for text, audio, and video therapy — covered by many U.S. insurance plans and employers.\n\nMore than 1 million people have used Talkspace for online therapy. Read member reviews at www.talkspace.com/reviews.\n\nTalkspace uses clinician-informed, responsible AI tools to support care that always stays human-first: every member is treated by a licensed therapist.\n\nHOW DOES TALKSPACE WORK?\nTell us your preferences and get matched with a licensed therapist in your state, often the same day. Send unlimited text, audio, picture, or video messages anytime and receive responses at least once a day, 5 days a week — so you can process things as they happen instead of waiting for a weekly appointment.\n\nWHAT CAN TALKSPACE HELP WITH?\nTalkspace therapists treat a wide range of mental health needs, including anxiety, depression, stress and burnout, relationship challenges, trauma and PTSD, substance use, and grief. Whatever brings you to therapy, you'll be matched with a therapist experienced in your area of need.\n\nIS TALKSPACE FOR TEENS?\nYes. Talkspace offers online therapy for teens ages 13–17 with therapists specialized in adolescent mental health — including school stress, anxiety, and self-esteem. Parental or guardian consent is required to get started.\n\nDOES TALKSPACE OFFER PSYCHIATRY OR COUPLES THERAPY?\nYes. In addition to individual therapy, Talkspace offers psychiatry (evaluation and medication management with licensed prescribers) and couples therapy — all online, in the same app.\n\nIS TALKSPACE COVERED BY INSURANCE?\nYes. Talkspace is in-network with leading U.S. health plans and partners with many employers, so most covered members pay a copay similar to an in-person visit. Enter your insurance or employer details at checkout to check eligibility in seconds.\n\nHOW MUCH DOES TALKSPACE COST?\nMany members pay only a copay through insurance. Without insurance, choose a subscription plan that fits your needs and budget. Visit our Help Center for pricing details.\n\nIS TALKSPACE EFFECTIVE?\nTalkspace has been shown to be as effective as face-to-face therapy: in one study, 81% of participants found Talkspace as effective or better than in-person therapy, and users showed significant improvement in depression and anxiety symptoms within 2 months. Talkspace has been featured in The Wall Street Journal, CNN, and Business Insider.\nResearch: research.talkspace.com | Press: talkspace.com/press\n\nWHO ARE THE TALKSPACE THERAPISTS?\nThe Talkspace network includes thousands of licensed therapists across all 50 states, all vetted and credentialed according to NCQA standards. If your first match isn't the right fit, you can switch therapists anytime.\n\nIS TALKSPACE SECURE?\nYour safety and security are our #1 priorities. Talkspace is protected with banking-grade encryption and externally audited for HIPAA compliance. Full Privacy Policy: talkspace.com/public/privacy-policy\n\nWHAT IS TALKCAST?\nTo help you stay engaged between sessions, your therapist can create Talkcast personalized podcasts: after your therapist reviews a script based on your therapy goals, our AI engine generates a custom recording you can listen to anytime.\n\nWHO IS TALKSPACE BEST FOR?\nTalkspace is ideal for anyone who wants therapy that fits a busy schedule, prefers messaging a therapist over weekly appointments, wants to use insurance for mental health care, or is starting therapy for the first time and wants a low-pressure way to begin.\n\nCONNECT WITH US\nQuestions o ems%5D=40&limit%5Breviews%5D=8&l=en-US","destination":{"storefront":"us","language":"en-US","$kind":"ProductPageIntent","id":"661829386","platform":"iphone"}}},{"$kind":"Lockup","title":"stoic. journal & mental health","adamId":"1312926037","impressionMetrics":{"fields":{"id":"1312926037","name":"stoic. journal & mental health","impressionType":"lockup","idType":"its_id","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","platformDisplayStyle":"ios","impressionIndex":9,"contentRating":200,"bundleId":"com.mlobodzinski.Stoic"}},"bundleId":"com.mlobodzinski.Stoic","isEditorsChoice":false,"subtitle":"AI journaling, Gratitude diary","rating":4.8,"ratingCount":"36K","decorations":[],"icon":{"$kind":"Artwork","crop":"bb","template":"https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/20/74/ef/2074ef77-b6d0-1428-f02d-74eae96f319f/Placeholder.mill/{w}x{h}{c}.{f}","width":1024,"height":1024,"variants":[{"$kind":"ArtworkVariant","format":"jpeg","quality":70,"supportsWideGamut":false}],"backgroundColor":{"red":0.996078431372549,"green":0.996078431372549,"blue":0.996078431372549,"type":"rgb"},"textColor":{"red":0.043137254901960784,"green":0.043137254901960784,"blue":0.043137254901960784,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"AI journaling, Gratitude diary","editorialTagline":"New mindful walking meditations","editorialDescription":"Bookend your days with a moment of reflection in stoic., an elegantly designed journaling app made for anyone looking to carve out time for mindfulness. With insightful reflection prompts and breathing exercises, the app is filled with multiple ways to care for your mental health—with inspiration from stoic philosophy at its core. ","shortEditorialDescription":"Meet your daily companion for journaling, meditation and reflection.","ageRating":"9+","productDescription":"stoic is your mental health companion – it helps you understand your emotions and provides insights on how to be happier, more productive, and overcome obstacles.\n\nAt its heart, stoic helps you prepare for your day in the morning and reflect on your day in the evening. In the process, we also guide you to journal with thought-provoking prompts, build better habits, track your moods, and more.\n\n** ‘Featured App of the Day’ - Apple **\n\n* Join over 4 million stoics bettering their lives *\n\n“I have never used a journal app that has impacted my life so much. It's my best friend.” –  Michael\n\nMORNING PREPARATION & EVENING REFLECTION:\n\n• Start the perfect day with our personalized daily planner. Prepare your notes and to-do list so nothing can surprise you during the day.\n• Track your mood throughout the day and do bite-sized mental health exercises if you need them.\n• Reflect on your actions with our habit tracker in the evening to grow as a human and get better every day.\n\nGUIDED JOURNALS:\n\nWhether you're a journaling pro or new to the practice, stoic offers a welcoming space with guided journals, suggestions, and prompts to inspire reflection and cultivate the habit. If writing is not your cup of tea, you can also journal with voice notes and pictures/videos of your day.\n\nChoose from topics in productivity, happiness, gratitude, stress & anxiety, relationships, therapy, self-discovery, and much more. Stoic also has templates to help you with a variety of situations like preparing for a therapy session, CBT-based thought dumps, dream & nightmare journal, etc.\n\nJournaling is a therapeutic tool for clearing the mind, expressing thoughts, setting goals, practicing gratitude, emotional wellbeing, and promoting self-reflection.\n\n\nMENTAL HEALTH TOOLS:\n\nstoic provides you with the tools you need to feel better, reduce stress & anxiety, manage ADHD, be mindful and more.\n\n• Meditation – unguided or guided sessions to help you meditate with background sounds and timed chimes.\n• Breathing – science-backed exercises to help you relax, focus, feel calm, sleep better and more.\n• Stoic Shield - block distracting apps and reduce screen time.\n• Sleep Better - journal your dreams, nightmares, and overcome insomnia with lessons by Huberman and Sleep Foundation.\n• Quotes & Affirmations – read up on stoic philosophy and better your mood.\n• Therapy Notes – prepare for your therapy sessions, track your progress, and reflect on them.\n• Daily Prompts - thought-provoking prompts to help you journal better.\n\nAND SO MUCH MORE:\n\n• Privacy – protect your journal with a passcode, TouchID, or FaceID.\n• Streaks & Badges – stay motivated on your journey with our habit tracker.\n• Journey – reflect on your history, search based on prompts, see how your responses changed over time and see your growth.\n• Trends – visualize metrics that matter to you including mood, emotions, sleep, health, writing, and more.\n• Export – share your journal diary with your therapist.\n• iCloud Sync – seamlessly sync your journal across your iPhone, Mac, iPad and Apple Watch and safely backup stoic on your personal iCloud storage.\n• Siri Shortcuts – start a journal by simply asking Siri.\n• Health App Integration – track your mindful minutes, sleep and more in Trends.\n\nWe’re constantly adding more mental health tools to help you overcome more obstacles and situations. You can also join our supportive community on Discord and leave your suggestions in our feedback board.\n\nSTOIC PREMIUM:\n\n• Enjoy unlimited access to premium features on a subscription basis.\n• Your payment will be charged to your iTunes account upon confirmation of purchase. Your account will be charged for renewal within 24 hours prior to the end of the current period.\n• You can easily manage your subscription and turn off auto-renewal in Apple's settings.\n• Read our Terms & Conditions at https://getstoic.com/terms-and-conditions\n\nIf you choose not to purchase stoic Premium, aging stress, anxiety, and low mood. Learn what affects your mood, develop healthier thought patterns, problem solve with the AI chatbot, practice effective coping skills, build resilience, and foster personal growth.\n\nHOW IT WORKS\nClarity is built on proven methods widely studied and endorsed in the world of mental health. The core principle is simple yet powerful: by understanding and changing your thoughts, you can better manage your emotions and actions.\n\nClarity integrates approaches from behavioral science, positive psychology, and mindfulness to bring you the best self-care tools offered by modern science.\n\nREFRAME YOUR THOUGHTS\n- Use proven techniques to break free from negative thought cycles.\n- Identify and confront Cognitive Distortions hindering your mental well-being.\n- Challenge and transform your thought processes for the better.\n\nAI-INFUSED JOURNALING & CHAT\n- Step into the future of mental health with innovative AI features.\n- Journal with AI-driven questions and analysis that adapt to your mental state.\n- Feel heard with a thoughtful and compassionate AI Chatbot built for self-reflection.\n\nCHECK IN FOR INSIGHTS & REWARDS\n- Seamlessly track your moods, emotions, and activities.\n- Derive actionable insights by examining patterns and trends.\n- Earn fresh badges each month and track your progress with widgets.\n\nDISCOVER YOURSELF\n- Engage with thoughtfully crafted Guided Journals to deepen self-awareness.\n- Follow a personalized daily plan designed to build lasting mental health habits.\n- Explore your authentic self with science-backed personality tests and more.\n\nCURATED WELLNESS LIBRARY\n- Level up your knowledge with educational mental health programs.\n- Reduce stress with mindfulness meditation audios, soundscapes, and breathwork.\n- Find joy and calm with daily wellness tips and positive affirmations.\n\nTESTIMONIALS\n\"This app has saved my life.\"\n\n\"The repeated nature of doing these check-ins really does begin to soften hard-worn beliefs. I now find my thought processes shifting to more positive and growth-minded reframes at times when I would have wallowed in negative self-talk.\"\n\n\"Within the first few days of using the app to record how I was feeling and my moods, I started to feel better. It was like my mind was becoming less cloudy.\"\n\nDESIGNED WITH PURPOSE\nWe believe in increasing access to mental wellness by sharing knowledge and evidence-based self-help techniques. Clarity was created with care by a team with backgrounds in psychology and mental health research.\n\nPRIVACY AND SECURITY\nWe do not sell your data. Your journal entries are stored locally on your phone by default. Data backup is optional.\n\nSUBSCRIPTION\nPro Mode is an optional subscription that unlocks all Guided Journals, AI Chatbots, Assessments, Programs, Crash Courses, Audios, Breathwork, Tips, Affirmations, and Advanced Insights features.\n\nPricing may vary depending on the country. Payment will be charged to your iTunes Account at confirmation of purchase. Your subscription will renew automatically unless you turn off auto-renew at least 24 hours before the end of the current period. You may manage your subscription and auto-renewal may be turned off within your Account Settings after the purchase.\n\nDISCLAIMER\nClarity is a self-help and educational tool, not a therapy app. It does not provide and is not a substitute for licensed psychotherapy, counseling, or psychiatric treatment. It is not a medical device and is not intended to diagnose, treat, cure, or prevent any mental health condition. The content and features in this app do not constitute professional medical diagnosis or treatment. Always consult a qualified healthcare provider with any questions regarding a medical or mental health condition.\n\nEULA: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nTerms of Use: https://thinkwithclarity.com/termsofservice\nPrivacy Policy: https://thinkwithclarity.com/privacypo nt":"us","language":"en-US","$kind":"ProductPageIntent","id":"1010391170","platform":"iphone"}}},{"$kind":"Lockup","title":"Rootd: Panic Attacks & Anxiety","adamId":"1289018369","impressionMetrics":{"fields":{"id":"1289018369","name":"Rootd: Panic Attacks & Anxiety","impressionType":"lockup","idType":"its_id","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","platformDisplayStyle":"ios","impressionIndex":2,"contentRating":100,"bundleId":"org.reactjs.native.example.rootd"}},"bundleId":"org.reactjs.native.example.rootd","isEditorsChoice":false,"subtitle":"Stress Relief CBT Relax Games","rating":4.8,"ratingCount":"11K","decorations":[],"icon":{"$kind":"Artwork","crop":"bb","template":"https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/b9/d7/52/b9d752ed-57df-b8ba-c461-7e313d2ed7e2/Placeholder.mill/{w}x{h}{c}.{f}","width":1024,"height":1024,"variants":[{"$kind":"ArtworkVariant","format":"jpeg","quality":70,"supportsWideGamut":false}],"backgroundColor":{"red":0.45098039215686275,"green":0.7568627450980392,"blue":0.7764705882352941,"type":"rgb"},"textColor":{"red":0.027450980392156862,"green":0.054901960784313725,"blue":0.058823529411764705,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":true,"useAdsLocale":false,"tertiaryTitle":"Designed for iPad.\nNot verified for macOS.","tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Stress Relief CBT Relax Games","editorialTagline":"Tools to manage stress","editorialDescription":"When you’re experiencing anxiety, immediate solutions can be a game changer. Rootd offers instant relief with content to help you work through a panic attack or find a moment of mindfulness. Find support through journaling, breathing exercises, visualizations, and more. Plus take a weekly anxiety questionnaire and see your average monthly results to help you track progress over time. ","shortEditorialDescription":"Overcome panic attacks and anxiety with breathing exercises.","ageRating":"4+","productDescription":"** Editor's Choice ** — Apple\n** App of the Day ** — Apple\n** Approved for privacy, security, clinical assurance, and safety ** —  DHAF & ORCHA\n\nRootd is anxiety and panic attack relief in your pocket. Award-winning, scientifically validated, female led and seen in Women's Health, Time Magazine, Healthline and more. With millions of users worldwide, Rootd is the go-to app for anxiety & panic attacks for more and more people each day.\n\n“I’ve suffered from panic attacks for almost 10 years. I’ve done CBT, medication, meditation, but nothing helped me in the moment when that panic attack hit, until I downloaded Rootd. Rootd makes it feel like someone is with me, even when I’m alone. I owe my continued stability to this simple genius app. It's a MUST for all who are facing the same type of war.” RainyNally\n\nUnderstand, and overcome anxiety & panic attacks with Rootd’s therapist-approved panic button, guided deep breathing, anxiety journal, soothing visualizations, stats page, emergency contact, and lessons. \n\nWe set out to build Rootd after suffering from panic attacks and anxiety for several years. The only help we could find was either too expensive, ineffective, or poorly designed. Our mission is to help others find accessible relief from their panic and anxiety, and to end the stigma against those affected. \n\nFinally, an app for conquering panic attacks and anxiety that blends a guided process for both immediate and long term relief, with clean and engaging design.  \n\nRootd’s core features and content include:\n\nTHE ROOTR, PANIC ATTACK SOS BUTTON\nA panic button to bring a swift end to panic attacks based on the latest techniques in Cognitive Behavioural Therapy (CBT).\n\nLESSONS\nFind some peace of mind by learning about where anxiety comes from, how our bodies and minds experience panic attacks, and why this all might be happening to you.\n\nBREATHE\nThe perfect tool to practice deep breathing daily and find calm during times of stress.\n\nJOURNAL\nTrack and identify moods, habits, and subconscious triggers of anxiety and panic attacks.\n\nVISUALIZE\nGuided body scans, visualizations, ASMR, and nature sounds to get rooted when feeling anxious.\n\nSLEEP\nWhite noise, ASMR, sleep stories, relaxing sounds, and music for you to gain calm and sleep deeply.\n\nEMERGENCY CONTACT\nFor when you need to hear a friendly voice, you can immediately call a friend, family member, or nearby help center directly from the app. \n\nPERSONAL STATS\nTake pride in your healing progress and gain appreciation for how far you’ve come.\n\nTo continue your journey, you can upgrade to unlock Full Access to Rootd, including:\n\nMORE LESSONS\nLearn changes you can make and exercises you can perform to guide you through the remainder of the journey to lifelong relief and to living panic attack free.\n\nRootd saves your Breathe, Visualize, and Sleep sessions to your Apple Health app.\n\nSubscription Pricing and Terms\n\nGet full access to all Rootd's content and features by purchasing a monthly or yearly auto-renewing Full Access subscription. Or get lifetime full access for a one-time payment. Pricing may vary by country.\n\nPayment will be charged to your iTunes Account at confirmation of purchase. Your Rootd subscription will automatically renew at the end of each term and your credit card will be charged through your iTunes account unless auto-renew is turned off at least 24-hours before the end of the current period. Subscriptions may be managed and auto-renewal turned off any time from your iTunes Account Settings after purchase.\n\n“I appreciate the simple, factual, and yet caring approach of Rootd that makes it an inviting, interesting, and easy to use tool. I endorse this for individuals looking for support and tools for managing anxiety and panic attacks.”\nWendy Marion-Orienti - Licensed PRH counsellor\n\nTerms: https://www.rootd.io/terms-conditions\nPrivacy Policy: https://www.rootd.io/privacy-polic s and find encouragement.\r\n\r\nMental Health Support for Anxiety, Stress & Depression\r\n• Manage anxiety and panic attacks with guided mindfulness and therapeutic breathing exercises.\r\n• Reduce stress and boost your mood with over 300 free mental health exercises, self-care activities, and virtual guides.\r\n• Cognitive Behavioral Therapy (CBT) techniques to help reframe negative thoughts.\r\n• Personalized self help tools and mental health care with our free wellness test.\r\n\r\nWhy Choose 7 Cups for Counseling & Therapy?\r\n\r\n• Confidential & Anonymous: Your identity remains private—even from your therapist or listener. \r\n• Flexible & Affordable: Free emotional support sessions and low-cost online therapy options for individuals without insurance.\r\n• Recognized & Trusted Treatments: An award-winning mental health app, acknowledged by Stanford MedicineX for innovation in healthcare.\r\n• Inclusive & Accepting: We support everyone, regardless of age, gender, sex, or background\r\n• Group support: Share your experiences and gain new insights in support groups with licensed therapists.\r\n\r\nFind Support Anytime, Anywhere\r\n\r\nLife’s challenges don’t follow a schedule. Whether you’re dealing with work stress, anxiety, depression, trauma, relationship problems, divorce self-esteem issues or you just want to talk to someone, finding a therapist or counselor can be a time-consuming and expensive process. You can’t always talk to friends, family, or coworkers, that’s why 7 Cups provides instant mental health support, remote counseling services, advice, and stress relief—anytime you need it. \r\n\r\n100% Confidential Mental Health Help & Chat:\r\nRemain 100% anonymous. No one will ever know who you are—not even your listeners, counselor or therapist.\r\n\r\n7 Cups’ Listeners Care About You:\r\nOur listeners are volunteers. They aren’t getting paid; they’re here because they want to help.\r\n\r\nWe have over 450,000 trained listeners, licensed therapists and elationships, family problems or a bad day, Ash can help right now with a private, zero judgment space to speak freely. Ash is built for long-term growth, learning from your patterns and building a program to help you reach the goals you want. Each week, get personalized insights to help you understand yourself more deeply and move forward with clarity.\n\nHow is Ash built?\n\nMost AI tools were built using data from the internet. Ash is a specialist AI in human psychology trained on a large-scale data set of proprietary expert data, and is designed and guided by an expert team of the world’s top mental health leaders. Use Ash AI for motivation, accountability, support, reflection, encouragement, pattern-breaking, or a catalyst for change.\n\nWhat outcomes have you seen from people who downloaded Ash?\n\nFor users who speak to Ash a few times a week or more:\n\n- 91% made progress or met goals they set for themselves\n- On average, users have about one more meaningful real-world relationship\n*Based on an ongoing research study\n\nWhat does Ash do?\n\nAsh gives you a secure space where you can share your unfiltered thoughts without fear of judgement. It remembers what you say, and learns from your interactions to find patterns and generate insights specific to you. It’s available 24/7 over voice & text, so you can use it for a quick check-in or longer deep dive.\n\nWho made Ash?\n\nAsh is built by a team of therapists, mental health leaders, AI researchers, engineers, and designers. Our work is inspired by our personal stories, lived experience, and loved ones on similar journeys. We believe in a future where quality personalized support is available exactly when people need it.\n\nFeatures of Ash\n\nNo judgment: Say what you really feel, and get professional guidance.\n\nWeekly insights: Ash helps identify themes and patterns of your life.\n\nLong-term growth: Ash is designed to help you do the hard work for real change.\n\n24/7, speak or text: Talk to Ash at home, or text Ash in an Uber.\n\nPrivacy-first design: Speak with the confidence that your chats are secure and anonymous.\n\nA fully personalized program: Ash learns from and builds custom support for each person. Get the precise modalities and therapeutic style that you need right now.\n\nTestimonials\n\n- “As a therapist myself, I’m really impressed by this app!”\n\n- “The weekly insights is the best part of this app. Ash spotted patterns of my thoughts in ways I've never considered. And the next steps have given me ways to grow. This is extremely helpful.”\n\n- “I cried so hard. It’s so relieving to express myself freely.”\n\n- “My strengths are all being pointed out and I really appreciate it. I've been thinking I'm not real great at anything. I really needed this.”\n\n- “I'm actually finding support in this app in a way that feels private, useful and keeps my sense of self-respect. I don't go around telling other people about what's going on so it's very nice.”\n\n- “Fantastic! We solved a problem I have been dealing with for a week in 5 minutes.”\n\nAsh is designed for users 18+. Ash sometimes makes things up. Ash is not a replacement for any medical diagnosis or treatments. Ash cannot, and does not intend to, provide medical advice or diagnosis. Interaction with Ash does not constitute a medical professional–patient relationship. Please do not avoid or delay medical attention as a result of a statement from Ash.\n\nAsh is not designed to be used in crisis. If you are in crisis, please seek out professional help, or a crisis line. You can find resources at www.findahelpline.com.","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=6474862947&pricingParameters=STDQ&pg=default&appExtVrsId=892462960"},"location":[{"locationPosition":0,"locationType":"button","na intelligent journal & mood tracker that gives you personalized prompts and motivation the more you use it.\n \nTHE BEST JOURNAL APP FOR SELF-CARE AND MINDFULNESS\n \nHow you’re feeling on a daily basis matters. Reflectly is a personal journal driven by AI to help you deal with negative thoughts and increase positivity.\n \nBe prepared for stress relief, reducing anxiety & depression in your life. Your self-care and mental health should always be a priority.\n \nReflectly uses positive psychology, mindfulness, and cognitive behavioral therapy (cbt) to help you thrive. It gives you the tools and mindset to build a positive cycle with our habit tracker. Fancy a bit of self-dating? Reflectly supports your self-love journey.\n \nNever journaled before? No need to worry, our intelligent journal system gives you personalized prompts and reminders. If you want to build a health-focused lifestyle, increase motivation & gratitude, practice mindfulness, or combat anxiety, our personalized questions encourage deeper reflection. \n \nRECOMMENDED BY PROFESSIONALS\n \nJournaling is a respected method to improve your mood, productivity, and mental health. Psychologists, therapists, and industry experts reaffirm this. It’s time to invest in your self-care routine.\n \nHOW REFLECTLY WORKS\n \n• Write down how you feel each day. Morning daily motivation quotes & challenges, evening daily insights, and whenever you need to vent.\n• Using AI & smart tech, Reflectly’s mood tracker helps by showing you mood correlations and graphs. Been stressed for the last 10 days and can’t pin-point why? Reflectly has answers.\n• We ask personalized questions based on your diary entries so you can reflect deeper.\n• Read or edit previous journal entries.\n• Receive daily, weekly, and monthly overviews with personalized insights and reminders.\n \nREVIEWS\n \n- \"It’s a really amazing app. It’s the one app I go to write about my feelings and how my day was :) I really recommend this app to ANYONE.\"\n- nd":"ArtworkVariant","format":"jpeg","quality":70,"supportsWideGamut":false}],"backgroundColor":{"red":0.9529411764705882,"green":0.984313725490196,"blue":0.9803921568627451,"type":"rgb"},"textColor":{"red":0.06666666666666667,"green":0.16470588235294117,"blue":0.1843137254901961,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Online Mental Health Support","ageRating":"13+","productDescription":"Talkspace is an online therapy app that connects adults and teens (13+) with licensed therapists in their state for text, audio, and video therapy — covered by many U.S. insurance plans and employers.\n\nMore than 1 million people have used Talkspace for online therapy. Read member reviews at www.talkspace.com/reviews.\n\nTalkspace uses clinician-informed, responsible AI tools to support care that always stays human-first: every member is treated by a licensed therapist.\n\nHOW DOES TALKSPACE WORK?\nTell us your preferences and get matched with a licensed therapist in your state, often the same day. Send unlimited text, audio, picture, or video messages anytime and receive responses at least once a day, 5 days a week — so you can process things as they happen instead of waiting for a weekly appointment.\n\nWHAT CAN TALKSPACE HELP WITH?\nTalkspace therapists treat a wide range of mental health needs, including anxiety, depression, stress and burnout, relationship challenges, trauma and PTSD, substance use, and grief. Whatever brings you to therapy, you'll be matched with a therapist experienced in your area of need.\n\nIS TALKSPACE FOR TEENS?\nYes. Talkspace offers online therapy for teens ages 13–17 with therapists specialized in adolescent mental health — including school stress, anxiety, and self-esteem. Parental or guardian consent is required to get started.\n\nDOES TALKSPACE OFFER PSYCHIATRY OR COUPLES THERAPY?\nYes. In addition to individual therapy, Talkspace offers psychiatry (evaluation and medication management with licensed prescribers) and couples therapy — all online, in the same app.\n\nIS TALKSPACE COVERED BY INSURANCE?\nYes. Talkspace is in-network with leading U.S. health plans and partners with many employers, so most covered members pay a copay similar to an in-person visit. Enter your insurance or employer details at checkout to check eligibility in seconds.\n\nHOW MUCH DOES TALKSPACE COST?\nMany members pay only a copay through insurance. Without insurance, choose a subscription plan that fits your needs and budget. Visit our Help Center for pricing details.\n\nIS TALKSPACE EFFECTIVE?\nTalkspace has been shown to be as effective as face-to-face therapy: in one study, 81% of participants found Talkspace as effective or better than in-person therapy, and users showed significant improvement in depression and anxiety symptoms within 2 months. Talkspace has been featured in The Wall Street Journal, CNN, and Business Insider.\nResearch: research.talkspace.com | Press: talkspace.com/press\n\nWHO ARE THE TALKSPACE THERAPISTS?\nThe Talkspace network includes thousands of licensed therapists across all 50 states, all vetted and credentialed according to NCQA standards. If your first match isn't the right fit, you can switch therapists anytime.\n\nIS TALKSPACE SECURE?\nYour safety and security are our #1 priorities. Talkspace is protected with banking-grade encryption and externally audited for HIPAA compliance. Full Privacy Policy: talkspace.com/public/privacy-policy\n\nWHAT IS TALKCAST?\nTo help you stay engaged between sessions, your therapist can create Talkcast personalized podcasts: after your therapist reviews a script based on your therapy goals, our AI engine generates a custom recording you can listen to anytime.\n\nWHO IS TALKSPACE BEST FOR?\nTalkspace is ideal for anyone who wants therapy that fits a busy schedule, prefers messaging a therapist over weekly appointments, wants to use insurance for mental health care, or is starting therapy for the first time and wants a low-pressure way to begin.\n\nCONNECT WITH US\nQuestions or feedback? Email support@talkspace.com or visit talkspace.com. \nFollow Talkspace on X, Instagram, and Facebook.","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=661829386&pricingParameters=STDQ&pg=default&appExtVrsId=890355040"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"661829386","variantId":"default","experimentId":"424938e3-29da-456b-a040-13d8dad4a3da","experimentLocale":"en-US"},{"locationPosition":8,"locationType":"lockup","name":"Talkspace: Virtual Therapy App","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"661829386","variantId":"default","experimentId":"424938e3-29da-456b-a040-13d8dad4a3da","experimentLocale":"en-US"},{"locationPosition":8,"locationType":"similarItems","name":"You Might Also Like","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"661829386","eventType":"click","targetType":"button","targetId":"661829386","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"661829386"}},"$kind":"OfferAction","actionClass":"OfferAction","adamId":"661829386","purchaseConfiguration":{"$kind":"PurchaseConfiguration","buyParams":"productType=C&price=0&salableAdamId=661829386&pricingParameters=STDQ&pg=default&appExtVrsId=890355040","vendor":"Groop Internet Platform inc.","appName":"Talkspace: Virtual Therapy App","bundleId":"com.ta
