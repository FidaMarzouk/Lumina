[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina"
version = "0.2.0"
description = "Lumina — mental health support assistant: market intelligence, clinical knowledge RAG, emotional intelligence and a safety-first conversational orchestrator."
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
# torch is installed separately (GPU wheel): pip install torch --index-url https://download.pytorch.org/whl/cu128
nlp = [
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "spacy>=3.7",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
llm = [
    "openai>=1.40",          # OpenAI-compatible client for Groq and Ollama
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
voice = [
    "kokoro>=0.9.4",         # Kokoro-82M (Apache-2.0): local, natural text-to-speech
]
market = [
    "praw>=7.7",
    "google-play-scraper>=1.2.7",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "lingua-language-detector>=2.0",
    "scikit-learn>=1.5",
    "vaderSentiment>=3.3.2",  # kept only as a comparison baseline
    "matplotlib>=3.8",
    "jinja2>=3.1",
]
knowledge = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "lingua-language-detector>=2.0",
]
eval = [
    "scikit-learn>=1.5",
    "datasets>=2.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "jupyter>=1.0",
]
all = ["lumina[nlp,rag,llm,api,voice,market,knowledge,eval,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lumina.reporting" = ["*.css", "*.js"]

# pytest configuration: pytest.ini

[tool.ruff]
line-length = 110
target-version = "py311"
