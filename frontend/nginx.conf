# Same routing as the Vite dev proxy (vite.config.js): API paths go to the backend, the rest is the built UI.
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/(chat|tts|auth|users|sessions|journeys|journey|insights|jar)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;    # first LLM reply can be slow while Ollama loads the model
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
